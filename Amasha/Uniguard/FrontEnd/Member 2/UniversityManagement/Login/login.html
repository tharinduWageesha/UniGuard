<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniGuard - UM Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        /* =========================================
           UNIGUARD BLUE COLOR THEME
        ========================================= */
        :root {
            --primary-blue: #1976d2;
            --primary-blue-dark: #0d47a1;
            --primary-blue-light: #42a5f5;
            --primary-hover: #1565c0;

            --panel-blue-start: #102a43;
            --panel-blue-middle: #163d63;
            --panel-blue-end: #1b4f7d;

            --bg-main: #eef4fa;
            --bg-card: #ffffff;

            --text-dark: #1f2d3d;
            --text-muted: #66788a;

            --border-color: #d7e1eb;
            --input-bg: #f7fafd;
        }


        /* =========================================
           GLOBAL SETTINGS
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }


        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #edf4fa 0%,
                    #e5eef7 100%
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }


        /* =========================================
           MAIN LOGIN CONTAINER
        ========================================= */
        .login-container {
            width: 100%;
            max-width: 820px;
            min-height: 480px;

            display: flex;

            background: var(--bg-card);

            border: 1px solid #cdd9e5;
            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 16px 40px rgba(16, 42, 67, 0.14);
        }


        /* =========================================
           LEFT BRAND PANEL
        ========================================= */
        .brand-panel {
            width: 44%;
            min-height: 480px;

            background:
                linear-gradient(
                    135deg,
                    var(--panel-blue-start) 0%,
                    var(--panel-blue-middle) 55%,
                    var(--panel-blue-end) 100%
                );

            padding: 38px 36px;

            color: white;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            position: relative;
            overflow: hidden;
        }


        /* =========================================
           DECORATIVE BLUE GLOW
        ========================================= */
        .brand-panel::before {
            content: "";

            position: absolute;

            width: 320px;
            height: 320px;

            top: -150px;
            left: -120px;

            background:
                radial-gradient(
                    circle,
                    rgba(66, 165, 245, 0.28) 0%,
                    rgba(66, 165, 245, 0.10) 35%,
                    transparent 70%
                );

            pointer-events: none;
        }


        .brand-panel::after {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            right: -120px;
            bottom: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(25, 118, 210, 0.22),
                    transparent 70%
                );

            pointer-events: none;
        }


        /* =========================================
           LOGO HEADER
        ========================================= */
        .brand-header {
            display: flex;
            align-items: center;

            gap: 14px;

            position: relative;
            z-index: 2;
        }


        /* =========================================
           LOGO CONTAINER
        ========================================= */
        .brand-logo-badge {
            width: 62px;
            height: 62px;

            background:
                rgba(255, 255, 255, 0.96);

            border-radius: 14px;

            padding: 6px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            border:
                1px solid rgba(255, 255, 255, 0.50);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.20);
        }


        /* =========================================
           LOGO IMAGE
        ========================================= */
        .brand-logo-badge img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;

            border-radius: 8px;
        }


        /* =========================================
           BRAND TITLE
        ========================================= */
        .brand-title h2 {
            font-size: 24px;
            font-weight: 800;

            letter-spacing: -0.7px;

            color: #ffffff;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.12);
        }


        .brand-title p {
            margin-top: 3px;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1.5px;

            color: #7ec8ff;
        }


        /* =========================================
           CENTER CONTENT
        ========================================= */
        .brand-body {
            position: relative;
            z-index: 2;

            margin-top: auto;
            margin-bottom: auto;
        }


        .brand-body h1 {
            max-width: 320px;

            font-size: 28px;
            font-weight: 800;

            line-height: 1.35;

            letter-spacing: -0.5px;

            color: #ffffff;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.10);
        }


        /* =========================================
           FOOTER
        ========================================= */
        .brand-footer {
            position: relative;
            z-index: 2;

            font-size: 13px;
            font-weight: 500;

            color: #c5dcf1;
        }


        /* =========================================
           RIGHT LOGIN PANEL
        ========================================= */
        .form-panel {
            width: 56%;
            min-height: 480px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #fbfdff 100%
                );

            padding: 38px 42px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }


        /* =========================================
           FORM HEADER
        ========================================= */
        .form-header {
            margin-bottom: 24px;
        }


        .form-header h3 {
            font-size: 24px;
            font-weight: 800;

            color: var(--text-dark);

            margin-bottom: 6px;

            letter-spacing: -0.6px;
        }


        .form-header p {
            font-size: 13.5px;

            color: var(--text-muted);
        }


        /* =========================================
           FORM GROUP
        ========================================= */
        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 8px;

            color: #33475b;

            font-size: 12.5px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.8px;
        }


        .form-group label i {
            color: var(--primary-blue);
        }


        /* =========================================
           INPUTS
        ========================================= */
        .input-wrapper {
            position: relative;

            display: flex;
            align-items: center;
        }


        .input-wrapper input {
            width: 100%;
            height: 46px;

            padding: 0 45px 0 14px;

            border:
                1px solid var(--border-color);

            border-radius: 9px;

            background:
                var(--input-bg);

            color:
                var(--text-dark);

            font-size: 14px;

            outline: none;

            transition:
                all 0.25s ease;
        }


        .input-wrapper input:focus {
            background:
                #ffffff;

            border-color:
                var(--primary-blue);

            box-shadow:
                0 0 0 4px
                rgba(25, 118, 210, 0.13);
        }


        .input-wrapper input::placeholder {
            color: #98a8b8;
        }


        /* =========================================
           PASSWORD BUTTON
        ========================================= */
        .toggle-password {
            position: absolute;

            right: 10px;

            width: 34px;
            height: 34px;

            border: none;
            background: transparent;

            cursor: pointer;

            color: #687b8e;

            font-size: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: color 0.2s ease;
        }


        .toggle-password:hover {
            color: var(--primary-blue);
        }


        /* =========================================
           REMEMBER SESSION
        ========================================= */
        .form-options {
            margin-top: -2px;
            margin-bottom: 22px;
        }


        .remember-me {
            display: flex;
            align-items: center;

            gap: 8px;

            color: #607285;

            font-size: 13.5px;

            cursor: pointer;
        }


        .remember-me input {
            width: 17px;
            height: 17px;

            accent-color:
                var(--primary-blue);

            cursor: pointer;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */
        .btn-primary-login {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 9px;

            background:
                linear-gradient(
                    90deg,
                    #1976d2 0%,
                    #1e88e5 55%,
                    #1976d2 100%
                );

            color: #ffffff;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            box-shadow:
                0 8px 18px
                rgba(25, 118, 210, 0.26);

            transition:
                all 0.25s ease;
        }


        .btn-primary-login:hover {
            transform:
                translateY(-2px);

            background:
                linear-gradient(
                    90deg,
                    #0d47a1 0%,
                    #1976d2 100%
                );

            box-shadow:
                0 12px 24px
                rgba(13, 71, 161, 0.30);
        }


        .btn-primary-login:active {
            transform:
                translateY(0);
        }


        /* =========================================
           TABLET RESPONSIVE
        ========================================= */
        @media (max-width: 900px) {

            .login-container {
                max-width: 580px;

                flex-direction: column;
            }


            .brand-panel,
            .form-panel {
                width: 100%;
                min-height: auto;
            }


            .brand-panel {
                padding: 45px 45px;
            }


            .brand-body {
                margin: 75px 0;
            }


            .brand-body h1 {
                font-size: 34px;
            }


            .form-panel {
                padding: 55px 45px;
            }

        }


        /* =========================================
           MOBILE RESPONSIVE
        ========================================= */
        @media (max-width: 500px) {

            body {
                padding: 14px;
            }


            .login-container {
                border-radius: 16px;
            }


            .brand-panel {
                padding: 32px 25px;
            }


            .brand-header {
                gap: 14px;
            }


            .brand-logo-badge {
                width: 72px;
                height: 72px;

                padding: 7px;

                border-radius: 14px;
            }


            .brand-title h2 {
                font-size: 24px;
            }


            .brand-title p {
                font-size: 9px;
                letter-spacing: 1.2px;
            }


            .brand-body {
                margin: 55px 0;
            }


            .brand-body h1 {
                font-size: 28px;
            }


            .brand-footer {
                font-size: 12px;
            }


            .form-panel {
                padding: 42px 25px;
            }


            .form-header h3 {
                font-size: 26px;
            }


            .input-wrapper input {
                height: 55px;
            }

        }

    </style>

</head>


<body>

    <!-- MAIN LOGIN CONTAINER -->
    <div class="login-container">


        <!-- =====================================
             LEFT BRAND PANEL
        ====================================== -->
        <div class="brand-panel">


            <!-- LOGO AND BRAND NAME -->
            <div class="brand-header">

                <div class="brand-logo-badge">
                    <img src="logo2.jpeg" alt="UniGuard Logo">
                </div>


                <div class="brand-title">
                    <h2>UniGuard</h2>
                    <p>SECURITY SYSTEM</p>
                </div>

            </div>


            <!-- MAIN BRAND TEXT -->
            <div class="brand-body">

                <h1>
                    Command &amp; Control<br>
                    Access Portal
                </h1>

            </div>


            <!-- FOOTER -->
            <div class="brand-footer">
                &copy; University of Colombo Security Division
            </div>


        </div>


        <!-- =====================================
             RIGHT LOGIN PANEL
        ====================================== -->
        <div class="form-panel">


            <!-- LOGIN TITLE -->
            <div class="form-header">

                <h3>University Management Authentication</h3>

                <div id="loginError" style="display:none; color: #dc2626; background: #fef2f2; border: 1px solid #fca5a5; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; margin-top: 12px; text-align: center;"></div>

            </div>


            <!-- LOGIN FORM -->
            <form id="csoLoginForm"
                  onsubmit="handleLogin(event)">


                <!-- USERNAME -->
                <div class="form-group">

                    <label for="username">

                        <i class="fa-solid fa-user-shield"></i>

                        Username / Email

                    </label>


                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            autocomplete="username"
                        >

                    </div>

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">

                        <i class="fa-solid fa-key"></i>

                        Password

                    </label>


                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••••••"
                            required
                            autocomplete="current-password"
                        >


                        <!-- SHOW / HIDE PASSWORD -->
                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePasswordVisibility()"
                            aria-label="Show or hide password"
                        >

                            <i
                                class="fa-solid fa-eye"
                                id="toggleIcon"
                            ></i>

                        </button>

                    </div>

                </div>


                <!-- KEEP SESSION ACTIVE -->
                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Keep session active
                        </span>

                    </label>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="btn-primary-login"
                >

                    <i class="fa-solid fa-right-to-bracket"></i>

                    Login to Dashboard

                </button>


            </form>

        </div>


    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->
    <script src="../../../auth.js"></script>
    <script>

        /* PASSWORD SHOW / HIDE */
        function togglePasswordVisibility() {

            const passwordInput =
                document.getElementById("password");

            const toggleIcon =
                document.getElementById("toggleIcon");


            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");

            } else {

                passwordInput.type = "password";

                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");

            }

        }


        /* LOGIN FORM */
        async function handleLogin(event) {

            event.preventDefault();

            const usernameInput = document.getElementById("username");
            const passwordInput = document.getElementById("password");
            const errorDiv = document.getElementById("loginError");
            const loginBtn = document.querySelector(".btn-primary-login");

            const username = usernameInput ? usernameInput.value.trim() : "";
            const password = passwordInput ? passwordInput.value.trim() : "";

            if (errorDiv) {
                errorDiv.style.display = "none";
                errorDiv.textContent = "";
            }

            if (!username || !password) {
                if (errorDiv) {
                    errorDiv.textContent = "Please enter both username/email and password.";
                    errorDiv.style.display = "block";
                }
                return;
            }

            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            }

            try {
                let result;
                if (window.Auth && typeof window.Auth.login === "function") {
                    result = await window.Auth.login(username, password, "university management");
                } else {
                    const res = await fetch("/Uniguard/BackEnd/index.php?action=login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password, required_role: "university management" })
                    });
                    const data = await res.json();
                    result = {
                        success: res.ok && data.status === "success",
                        message: data.message || "Invalid username/email or password."
                    };
                    if (result.success) {
                        sessionStorage.setItem("uniguard_user", JSON.stringify(data.user));
                    }
                }

                if (result.success) {
                    window.location.href = "../dashboard/dashboard.html";
                } else {
                    if (errorDiv) {
                        errorDiv.textContent = result.message || "Invalid credentials or unauthorized role.";
                        errorDiv.style.display = "block";
                    } else {
                        alert(result.message || "Invalid credentials.");
                    }
                }
            } catch (err) {
                console.error("Login error:", err);
                if (errorDiv) {
                    errorDiv.textContent = "Server connection error. Please try again.";
                    errorDiv.style.display = "block";
                }
            } finally {
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard';
                }
            }

        }

    </script>

</body>

</html>
