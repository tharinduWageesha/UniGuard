<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniGuard - Visitor Registration</title>
  <style>
    :root{--blue:#1976d2;--dark:#102a43;--mid:#163d63;--end:#1b4f7d;--bg:#eef4fa;--text:#1f2d3d;--muted:#66788a;--border:#d7e1eb;--input:#f7fafd}
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{min-height:100vh;padding:18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#edf4fa,#e5eef7)}
    .register-container{width:100%;max-width:860px;min-height:520px;display:flex;overflow:hidden;background:#fff;border:1px solid #cdd9e5;border-radius:16px;box-shadow:0 16px 40px rgba(16,42,67,.14)}
    .brand-panel{position:relative;width:42%;padding:36px 32px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,var(--dark),var(--mid) 55%,var(--end))}
    .brand-header,.brand-body,.brand-footer{position:relative;z-index:1}.brand-header{display:flex;align-items:center;gap:14px}.brand-logo{width:62px;height:62px;border-radius:14px;padding:6px;display:grid;place-items:center;background:#fff;box-shadow:0 10px 24px #071f3880}.brand-logo img{width:100%;height:100%;object-fit:contain}.brand-title h2{font-size:24px;letter-spacing:-.5px}.brand-title p{margin-top:3px;color:#4bb2ff;font-size:10px;font-weight:bold;letter-spacing:1.5px}.brand-body h1{font-size:28px;line-height:1.35;letter-spacing:-.5px}.brand-body p{margin-top:12px;max-width:320px;color:#d7eaff;font-size:13.5px;line-height:1.6}.brand-footer{font-size:13px;font-weight:bold;color:#d7eaff}
    .form-panel{width:58%;padding:32px 36px;display:flex;align-items:center}.form-wrap{width:100%}.form-wrap h1{font-size:24px;letter-spacing:-.5px;color:var(--text)}.form-wrap>p{margin:4px 0 16px;color:var(--muted);font-size:13.5px}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}.field{margin-bottom:4px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:4px;color:#243f5c;font-size:11.5px;font-weight:bold;letter-spacing:.4px}.field label .req{color:#e14747}.input-wrap{position:relative}.input-wrap input{width:100%;height:38px;padding:0 36px 0 12px;border:1px solid var(--border);border-radius:8px;outline:0;background:var(--input);color:#253d55;font-size:13.5px}.input-wrap input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1976d21c}.input-icon{position:absolute;right:10px;top:9px;color:#6c849d;font-size:15px;cursor:pointer;border:0;background:transparent}.helper{font-size:10px;color:#8292a3;margin-top:3px}.terms{display:flex;gap:8px;align-items:flex-start;margin:2px 0 14px;color:#5d7185;font-size:12px;line-height:16px}.terms input{width:14px;height:14px;margin-top:1px;accent-color:var(--blue)}.terms a,.login-link a{color:var(--blue);font-weight:bold;text-decoration:none}.submit{width:100%;height:44px;border:0;border-radius:9px;color:#fff;background:#1976d2;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 8px 16px #1976d23d}.submit:hover{background:#1565c0}.success{display:none;margin-top:10px;padding:9px 11px;border-radius:8px;background:#e9f8ef;color:#168747;font-size:12px;font-weight:bold}.login-link{text-align:center;margin-top:14px;color:var(--muted);font-size:13px}
    @media(max-width:900px){.register-container{max-width:620px;height:auto;min-height:0}.brand-panel{display:none}.form-panel{width:100%;padding:40px 12%}}@media(max-width:520px){body{padding:12px}.register-container{height:auto}.form-panel{padding:32px 26px}.field-grid{grid-template-columns:1fr}.form-wrap h1{font-size:30px}}
  </style>
</head>
<body>
  <div class="register-container">
    <section class="brand-panel">
      <div class="brand-header">
        <div class="brand-logo"><img src="logo2.jpeg" alt="UniGuard Logo"></div>
        <div class="brand-title"><h2>UniGuard</h2><p>SECURITY SYSTEM</p></div>
      </div>
      <div class="brand-body"><h1>Visitor Access<br>Registration Portal</h1> <p></p>  </div>
      <div class="brand-footer">© University of Colombo Security Division</div>
    </section>
    <main class="form-panel">
      <div class="form-wrap">
        <h1>Create Visitor Account</h1>
        <p></p>
        <form id="registrationForm">
          <div class="field-grid">
            <div class="field"><label>FIRST NAME <span class="req">*</span></label><div class="input-wrap"><input type="text" required placeholder="Enter first name"></div></div>
            <div class="field"><label>LAST NAME <span class="req">*</span></label><div class="input-wrap"><input type="text" required placeholder="Enter last name"></div></div>
            <div class="field full"><label>EMAIL ADDRESS <span class="req">*</span></label><div class="input-wrap"><input type="email" required placeholder="Enter your email address"></div></div>
            <div class="field full"><label>USERNAME <span class="req">*</span></label><div class="input-wrap"><input type="text" required minlength="4" placeholder="Choose a username"></div><p class="helper">Use at least 4 characters.</p></div>
            <div class="field"><label>PASSWORD <span class="req">*</span></label><div class="input-wrap"><input id="password" type="password" required minlength="8" placeholder="Create password"><button class="input-icon" type="button" data-target="password">◉</button></div></div>
            <div class="field"><label>CONFIRM PASSWORD <span class="req">*</span></label><div class="input-wrap"><input id="confirmPassword" type="password" required minlength="8" placeholder="Confirm password"><button class="input-icon" type="button" data-target="confirmPassword">◉</button></div></div>
          </div>
          <p class="helper" style="margin: 4px 0 16px;">Password must contain at least 8 characters.</p>
          <button class="submit" type="submit">Create Account →</button>
          <div class="success" id="success">✓ Account created successfully! You can now log in.</div>
        </form>
        <p class="login-link">Already registered? <a href="../../Visitor/Login/login.html">Login to Dashboard</a></p>
      </div>
    </main>
  </div>
  <script>
    document.querySelectorAll('.input-icon').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.target);input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'◉':'◌'}));
    document.getElementById('registrationForm').addEventListener('submit',function(event){event.preventDefault();const password=document.getElementById('password'),confirmPassword=document.getElementById('confirmPassword');if(password.value!==confirmPassword.value){confirmPassword.setCustomValidity('Passwords do not match');confirmPassword.reportValidity();return}confirmPassword.setCustomValidity('');document.getElementById('success').style.display='block'});
  </script>
</body>
</html>
