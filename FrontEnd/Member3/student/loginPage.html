<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniGuard - Student Portal Login</title>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary-blue: #0088ff;
            --primary-hover: #0070d2;
            --primary-light: #eaf4ff;
            --dark-navy: #0f172a;
            --dark-surface: #1e293b;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-green: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* CONTAINER WRAPPER */
        .login-container {
            display: flex;
            width: 100%;
            max-width: 960px;
            min-height: 580px;
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
            border: 1px solid var(--border-color);
        }

        /* LEFT BRAND PANEL */
        .brand-panel {
            flex: 1;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* Decorative Grid Background */
        .brand-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at 10% 20%, rgba(0, 136, 255, 0.15) 0%, transparent 40%);
            pointer-events: none;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            z-index: 1;
        }

        .brand-logo-badge {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--primary-blue);
        }

        .brand-title h2 {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .brand-title p {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--primary-blue);
            letter-spacing: 0.8px;
        }

        .brand-body {
            z-index: 1;
            margin: 2rem 0;
        }

        .brand-body h1 {
            font-size: 1.75rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 0.75rem;
        }

        .brand-body p {
            font-size: 0.875rem;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* Quick System Stats Component */
        .system-status {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.6rem 0.9rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: fit-content;
            font-size: 0.75rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .brand-footer {
            z-index: 1;
            font-size: 0.7rem;
            color: #64748b;
            font-weight: 500;
        }

        /* RIGHT FORM PANEL */
        .form-panel {
            flex: 1.1;
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--bg-card);
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-header h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.3px;
            margin-bottom: 0.25rem;
        }

        .form-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* FORM INPUT GROUPS */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .form-group label i {
            color: var(--primary-blue);
            font-size: 0.85rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #f8fafc;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        .input-wrapper input::placeholder {
            color: #94a3b8;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-blue);
            background: #ffffff;
            box-shadow: 0 0 0 3.5px var(--primary-light);
        }

        .toggle-password {
            position: absolute;
            right: 0.85rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.95rem;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: var(--primary-blue);
        }

        /* OPTIONS */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1.25rem 0 1.75rem;
            font-size: 0.8rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 500;
        }

        .remember-me input {
            accent-color: var(--primary-blue);
            width: 16px;
            height: 16px;
            border-radius: 4px;
            cursor: pointer;
        }

        .forgot-password {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* BUTTON */
        .btn-primary-login {
            width: 100%;
            padding: 0.85rem;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 4px 12px rgba(0, 136, 255, 0.25);
            transition: all 0.2s ease-in-out;
        }

        .btn-primary-login:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 136, 255, 0.35);
        }

        .btn-primary-login:active {
            transform: translateY(0);
        }

        /* RESPONSIVE LAYOUT */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                max-width: 440px;
            }

            .brand-panel {
                padding: 2rem;
            }

            .brand-body {
                margin: 1.5rem 0;
            }

            .form-panel {
                padding: 2rem;
            }
        }
    </style>
</head>

<body>
    
    <div class="login-container">
        
        <!-- LEFT PANEL: BRANDING & SYSTEM INFO -->
        <div class="brand-panel">
            <div class="brand-header">
                <div class="brand-logo-badge">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <div class="brand-title">
                    <h2>UniGuard</h2>
                    <p>STUDENT PORTAL</p>
                </div>
            </div>

            <div class="brand-body">
                <h1>Student Services Access Portal</h1>

            </div>

           

            <div class="brand-footer">
                &copy; University of Colombo Security Division
            </div>
        </div>

        <!-- RIGHT PANEL: LOGIN FORM -->
        <div class="form-panel">
            <div class="form-header">
                <h3>Student Authentication</h3>
                <p>Enter your student credentials to proceed.</p>
                <div id="loginErrorMsg" style="display:none; margin-top:12px; padding:10px 14px; background-color:#fee2e2; border:1px solid #fca5a5; color:#991b1b; border-radius:8px; font-size:14px; font-weight:600;"></div>
            </div>

            <form id="studentLoginForm" onsubmit="handleLogin(event)">

                <div class="form-group">
                    <label for="username">
                        <i class="fa-solid fa-user-graduate"></i>Username
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fa-solid fa-key"></i> Password
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Keep session active</span>
                    </label>
                </div>

                <button type="submit" class="btn-primary-login">
                    <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
                </button>

            </form>
        </div>

    </div>

    <script src="../../auth.js"></script>
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('loginErrorMsg');
            const submitBtn = document.querySelector('.btn-primary-login');

            if (errorMsg) {
                errorMsg.style.display = 'none';
                errorMsg.textContent = '';
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

            const result = await Auth.login(usernameInput, passwordInput, 'Student');

            if (result.success) {
                window.location.href = result.data.redirect || 'dashboard/index.html';
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard';
                if (errorMsg) {
                    errorMsg.textContent = result.message;
                    errorMsg.style.display = 'block';
                } else {
                    alert(result.message);
                }
            }
        }
    </script>
</body>

</html>
